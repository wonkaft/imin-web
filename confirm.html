<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>imin</title>

<style>
  :root {
    --bg: #000;
    --white: #fff;
    --grey: #555;
    --grey-dim: #333;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
  }

  body {
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
  }

  .screen {
    width: 100%;
    max-width: 480px;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px;
    gap: 16px;
  }

  h1 {
    color: var(--white);
    font-size: 28px;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin: 0;
  }

  p {
    color: var(--grey);
    font-size: 15px;
    line-height: 1.5;
    margin: 0;
    max-width: 40ch;
  }

  .btn-primary {
    background: var(--white);
    color: var(--bg);
    border-radius: 8px;
    padding: 14px 28px;
    text-align: center;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    margin-top: 12px;
  }

  .fine {
    color: var(--grey-dim);
    font-size: 12px;
    margin-top: 24px;
  }
</style>
</head>
<body>

<div class="screen">
  <h1 id="heading">You're confirmed</h1>
  <p id="sub">Opening imin…</p>
  <a class="btn-primary" id="openBtn" href="#">Open imin</a>
  <p class="fine">If nothing happens, open the imin app on your phone and log in.</p>
</div>

<script>
  var hash = window.location.hash || '';
  var appUrl = 'imin://confirm' + hash;

  document.getElementById('openBtn').href = appUrl;

  if (hash.indexOf('access_token') !== -1) {
    window.location.href = appUrl;
  } else {
    document.getElementById('heading').textContent = 'imin';
    document.getElementById('sub').textContent = 'Open the imin app on your phone to continue.';
  }
</script>
</body>
</html>
