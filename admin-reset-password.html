<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700&family=Newsreader:ital,wght@1,600&display=swap" rel="stylesheet">

<title>imin Console</title>

<style>
  :root {
    --bg: #000;
    --white: #fff;
    --grey: #555;
    --grey-dim: #333;
    --rule: #1a1a1a;
    --danger: #d99490;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-wordmark-a: "Archivo", var(--font);
    --font-wordmark-b: "Newsreader", ui-serif, Georgia, serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
  }

  body {
    font-family: var(--font);
    color: var(--white);
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card {
    width: 100%;
    max-width: 340px;
    padding: 32px;
  }

  .wordmark {
    display: flex;
    align-items: baseline;
    justify-content: center;
    font-size: 28px;
    margin-bottom: 6px;
  }
  .wordmark .a { font-family: var(--font-wordmark-a); font-weight: 700; letter-spacing: -0.3px; }
  .wordmark .b { font-family: var(--font-wordmark-b); font-style: italic; font-weight: 600; letter-spacing: -0.3px; margin-left: 1px; }

  .sub {
    text-align: center;
    color: var(--grey);
    font-size: 13px;
    margin: 0 0 32px;
  }

  .field { margin-bottom: 16px; }
  label {
    display: block;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--grey);
    margin-bottom: 6px;
  }
  input {
    width: 100%;
    background: #0d0d0d;
    border: 0.5px solid var(--rule);
    border-radius: 8px;
    padding: 13px 14px;
    color: var(--white);
    font-size: 15px;
    font-family: var(--font);
  }
  input:focus { outline: none; border-color: #333; }

  button {
    width: 100%;
    background: var(--white);
    color: var(--bg);
    border: none;
    border-radius: 8px;
    padding: 14px;
    font-size: 15px;
    font-weight: 600;
    font-family: var(--font);
    cursor: pointer;
    margin-top: 8px;
  }
  button:disabled { opacity: 0.5; cursor: default; }

  .msg { font-size: 13px; text-align: center; margin-top: 16px; line-height: 1.5; }
  .msg.error { color: var(--danger); }
  .msg.ok { color: var(--grey); }
</style>

<div class="card">
  <div class="wordmark"><span class="a">im</span><span class="b">in</span></div>
  <p class="sub">Console</p>

  <div id="form">
    <div class="field">
      <label>New password</label>
      <input id="password" type="password" placeholder="8+ characters" autocomplete="new-password">
    </div>
    <div class="field">
      <label>Confirm password</label>
      <input id="confirm" type="password" placeholder="Re-enter password" autocomplete="new-password">
    </div>
    <button id="saveBtn">Save password</button>
    <p id="msg" class="msg"></p>
  </div>
</div>

<script>
  var SUPABASE_URL = 'https://fhvxdxxumwconxtvnsep.supabase.co';
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZodnhkeHh1bXdjb254dHZuc2VwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM4ODM0NzgsImV4cCI6MjA4OTQ1OTQ3OH0.3p8tIImH1HqP83r6TpHsesUi-zCXEu_0-LC5sQugE0s';
  var sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  var msgEl = document.getElementById('msg');
  var saveBtn = document.getElementById('saveBtn');

  function setMsg(text, kind) {
    msgEl.textContent = text || '';
    msgEl.className = 'msg' + (kind ? ' ' + kind : '');
  }

  async function init() {
    var hash = window.location.hash || '';
    var params = new URLSearchParams(hash.replace(/^#/, ''));
    var accessToken = params.get('access_token');
    var refreshToken = params.get('refresh_token');

    if (!accessToken || !refreshToken) {
      setMsg('This reset link is invalid or has expired. Request a new one from the console login screen.', 'error');
      saveBtn.disabled = true;
      return;
    }

    var { error } = await sb.auth.setSession({ access_token: accessToken, refresh_token: refreshToken });
    if (error) {
      setMsg('This reset link is invalid or has expired. Request a new one.', 'error');
      saveBtn.disabled = true;
    }
  }

  saveBtn.addEventListener('click', async function () {
    var password = document.getElementById('password').value;
    var confirm = document.getElementById('confirm').value;

    if (password.length < 8) {
      setMsg('Password must be at least 8 characters.', 'error');
      return;
    }
    if (password !== confirm) {
      setMsg("Passwords don't match.", 'error');
      return;
    }

    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving...';

    var { error } = await sb.auth.updateUser({ password: password });

    saveBtn.disabled = false;
    saveBtn.textContent = 'Save password';

    if (error) {
      setMsg(error.message, 'error');
    } else {
      document.getElementById('form').innerHTML = '<p class="msg ok">Password updated. You can close this tab and log in with your new password.</p>';
    }
  });

  init();
</script>
